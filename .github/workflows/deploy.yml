name: deploy

# Deploys the app to wervt on every push to main, with a deploy token that can deploy this app
# and nothing else. Setup (once):
#   wervt tokens <app> --create github     # or Deploy tokens in the dashboard
# then in the repository settings, Secrets and variables > Actions:
#   secret   WERVT_TOKEN   the token
#   variable WERVT_URL     the control plane URL
# Each release records the commit, branch, actor and this run.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds, uploads, migrates the database and activates the release.
      - id: deploy
        run: pnpm exec wervt deploy
        env:
          WERVT_URL: ${{ vars.WERVT_URL }}
          WERVT_TOKEN: ${{ secrets.WERVT_TOKEN }}
