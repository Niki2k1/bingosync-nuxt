# pnpm refuses to run install scripts it has not been told about; these are the only ones needed.
allowBuilds:
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@nuxt/cli@4.0.0'
  - '@nuxt/kit@4.6.0'
  - '@nuxt/nitro-server@4.6.0'
  - '@nuxt/schema@4.6.0'
  - '@nuxt/vite-builder@4.6.0'
  - '@nuxt/vite-server@4.6.0'
  - nuxt@4.6.0
  # Our own packages, released and checked by us.
  - '@wervt/*'
